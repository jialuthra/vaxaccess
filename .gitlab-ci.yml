# VaxAccess CI (DESIGN.md §4.13).
#
# Cross-phase contract (DESIGN.md §4.9): the frozen Phase I statistics Lambda reads
# pipelines produced by later work, so through Phase I grading keep
#   - a default-branch job named exactly `unit`,
#   - its normalized JUnit report at reports/junit.xml published as the pipeline test report,
#     with each test case's classname containing the repository-relative file path and suite
#     name ("tests/unit/a.test.ts > Suite"),
#   - its reports/unit-test-owners.json artifact at schema version 1
#     ({ schemaVersion, pipelineId, sha, owners }),
#   - an entry in tests/test-owners.json for every unit-test file.
# Changing any of these requires deploying a compatible Lambda, which the freeze does not allow.

default:
  image: node:24
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  before_script:
    - npm ci --cache .npm --prefer-offline --no-audit --no-fund

stages:
  - check
  - test
  - build
  - acceptance

check:
  stage: check
  script:
    - npm run lint
    - npm run typecheck
    - npm run validate-data

unit:
  stage: test
  script:
    # Record the test result instead of stopping, so the report step runs even after failures;
    # the final line then fails the job with Vitest's exit status.
    - npm run test-unit && TEST_STATUS=0 || TEST_STATUS=$?
    - npm run report-unit-tests
    - exit $TEST_STATUS
  artifacts:
    # Publish reports even when tests fail; the job itself still fails.
    when: always
    expire_in: 6 months
    paths:
      - reports/
    reports:
      junit: reports/junit.xml

build:
  stage: build
  script:
    - npm run build
  artifacts:
    expire_in: 1 week
    paths:
      - dist/

# Playwright browser tests against the production build (served by `vite preview`).
# Full suite in Chromium, @smoke tests in Firefox and WebKit. Results stay in this job's
# artifacts and do not feed the pipeline test report, which belongs to `unit`.
acceptance:
  stage: acceptance
  needs: []
  variables:
    PLAYWRIGHT_BROWSERS_PATH: $CI_PROJECT_DIR/.cache/ms-playwright
  cache:
    key:
      prefix: acceptance
      files:
        - package-lock.json
    paths:
      - .npm/
      - .cache/ms-playwright/
  script:
    - npx playwright install --with-deps chromium firefox webkit
    - npm run test-acceptance
  artifacts:
    when: always
    expire_in: 2 weeks
    paths:
      - playwright-report/
      - test-results/
