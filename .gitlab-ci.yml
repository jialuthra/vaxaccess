# VaxAccess CI (DESIGN.md §4.13).
#
# Cross-phase contract (DESIGN.md §4.9): the frozen Phase I statistics Lambda reads
# pipelines produced by later work, so through Phase I grading keep
#   - a default-branch job named exactly `unit`,
#   - its JUnit report at reports/junit.xml published as the pipeline test report,
#   - an entry in tests/test-owners.json for every unit-test file.

default:
  image: node:24
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  before_script:
    - npm ci --cache .npm --prefer-offline --no-audit --no-fund

stages:
  - check
  - test
  - build

check:
  stage: check
  script:
    - npm run lint
    - npm run typecheck
    - npm run validate-data

unit:
  stage: test
  script:
    - npm run test-unit
  artifacts:
    # Publish reports even when tests fail; the job itself still fails.
    when: always
    expire_in: 6 months
    paths:
      - reports/
    reports:
      junit: reports/junit.xml

build:
  stage: build
  script:
    - npm run build
  artifacts:
    expire_in: 1 week
    paths:
      - dist/
